name: DevSecOps Pipeline

on:
  push:
  pull_request:

# 🔴 REQUIRED FOR GHCR PUSH
permissions:
  contents: read
  packages: write

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      # 🔴 CHECKOUT CODE
      - name: Checkout
        uses: actions/checkout@v4

      # 🔴 SETUP NODE (LATEST)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 🔴 INSTALL DEPENDENCIES
      - name: Install Dependencies
        run: |
          cd app
          npm install

      # 🔴 SAST
      - name: Semgrep Scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: auto
        continue-on-error: true

      # 🔴 SECRET SCAN
      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true

      # 🔴 SCA
      - name: Snyk Scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true

      # 🔴 SBOM
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.json
        continue-on-error: true

      # 🔴 BUILD IMAGE
      - name: Build Docker Image
        run: docker build -t myapp .

      # 🔴 CONTAINER SCAN
      - name: Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: myapp
        continue-on-error: true

      # 🔴 LOGIN TO GHCR
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # 🔴 TAG IMAGE
      - name: Tag Image
        run: docker tag myapp ghcr.io/${{ github.repository }}/myapp:latest

      # 🔴 PUSH IMAGE
      - name: Push Image
        run: docker push ghcr.io/${{ github.repository }}/myapp:latest

      # 🔴 GENERATE REPORT
      - name: Generate Report
        run: |
          echo "DevSecOps Security Report" > report.txt
          echo "=========================" >> report.txt
          echo "SAST, SCA, Secrets, SBOM, Container scan completed." >> report.txt

      # 🔴 UPLOAD REPORT (LATEST VERSION)
      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: report.txt

      # 🔴 UPLOAD SBOM (LATEST VERSION)
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
